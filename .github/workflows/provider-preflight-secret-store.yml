name: FC20-03 Provider Preflight Secret Store

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fc20-03-provider-preflight-secret-store
  cancel-in-progress: false

jobs:
  presence-only:
    name: Verify secret presence without network access
    environment: provider-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ASIE_PROVIDER_SECRET_STORE_BACKEND: github_environment
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      TAVILY_PROJECT: ${{ secrets.TAVILY_PROJECT }}
      GOOGLE_MAP_ID: ${{ secrets.GOOGLE_MAP_ID }}
    defaults:
      run:
        working-directory: ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Presence-only secret-store gate
        run: python -m backend.provider_secret_store_readiness

