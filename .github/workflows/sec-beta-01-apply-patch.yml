name: SEC-BETA-01 Apply Surgical Patch

on:
  push:
    branches:
      - security/sec-beta-01-bootstrap-lockdown-2026-07-29

permissions:
  contents: write

jobs:
  apply-surgical-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out security branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply exact anchored patch
        working-directory: ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer
        run: python tools/_apply_sec_beta_01_patch.py

      - name: Compile patched security scope
        working-directory: ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer
        run: |
          python -m py_compile \
            backend/asie_local_api.py \
            backend/bootstrap_security.py \
            tools/create_initial_platform_admin.py

      - name: Run SEC-BETA-01 exploit regression tests
        working-directory: ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer
        run: python -m unittest discover -s tests -p 'test_sec_beta_01_bootstrap_lockdown.py'

      - name: Remove temporary patch machinery
        run: |
          rm ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer/tools/_apply_sec_beta_01_patch.py
          rm .github/workflows/sec-beta-01-apply-patch.yml

      - name: Validate diff and commit patched source
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): lock down production bootstrap identity paths'
          git push origin "HEAD:${BRANCH_NAME}"
