name: Deploy ASIE to Hostinger VPS

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Exact current main commit authorized for production release
        required: true
        type: string
      release_evidence_run_id:
        description: Successful public-beta Evidence-Backed Beta Release Gate run ID
        required: true
        type: string
      enable_external_fetch:
        description: Enable governed live provider network access
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  actions: read

concurrency:
  group: asie-production-deploy
  cancel-in-progress: false

jobs:
  authorize:
    name: Verify production release authority
    runs-on: ubuntu-latest
    env:
      ASIE_RELEASE_COMMIT: ${{ inputs.release_commit }}
      ASIE_RELEASE_EVIDENCE_RUN_ID: ${{ inputs.release_evidence_run_id }}
      ENABLE_EXTERNAL_FETCH: ${{ inputs.enable_external_fetch }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out requested release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASIE_RELEASE_COMMIT }}
          fetch-depth: 0

      - name: Require exact current main and explicit production authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          checked_out="$(git rev-parse HEAD)"
          current_main="$(git rev-parse origin/main)"
          test "$checked_out" = "$ASIE_RELEASE_COMMIT"
          test "$current_main" = "$ASIE_RELEASE_COMMIT"

          jq -e '
            .status == "CLEARED" and
            .controlled_unfreeze.public_release_authorized == true and
            .controlled_unfreeze.production_deployment_authorized == true
          ' EMERGENCY-RELEASE-FREEZE.json >/dev/null

          if [ "$ENABLE_EXTERNAL_FETCH" = "true" ]; then
            jq -e '
              .controlled_unfreeze.external_network_authorized == true and
              .controlled_unfreeze.provider_activation_authorized == true
            ' EMERGENCY-RELEASE-FREEZE.json >/dev/null
          fi

      - name: Require successful exact-commit public release evidence
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ASIE_RELEASE_EVIDENCE_RUN_ID}")"
          test "$(printf '%s' "$metadata" | jq -r '.name')" = "Evidence-Backed Beta Release Gate"
          test "$(printf '%s' "$metadata" | jq -r '.head_sha')" = "$ASIE_RELEASE_COMMIT"
          test "$(printf '%s' "$metadata" | jq -r '.head_branch')" = "main"
          test "$(printf '%s' "$metadata" | jq -r '.event')" = "workflow_dispatch"
          test "$(printf '%s' "$metadata" | jq -r '.status')" = "completed"
          test "$(printf '%s' "$metadata" | jq -r '.conclusion')" = "success"

          rm -rf production-release-evidence
          mkdir -p production-release-evidence
          gh run download "$ASIE_RELEASE_EVIDENCE_RUN_ID"             --repo "$GITHUB_REPOSITORY"             --name rel-beta-07-complete-evidence             --dir production-release-evidence

          report=production-release-evidence/rel-beta-07-final/beta-release-gate-report.json
          test -f "$report"
          jq -e --arg sha "$ASIE_RELEASE_COMMIT" '
            .release_commit == $sha and
            .decision == "GO" and
            .release_allowed == true and
            .public_beta_allowed == true and
            .critical_failures == []
          ' "$report" >/dev/null

  verify:
    needs: authorize
    runs-on: ubuntu-latest
    env:
      ASIE_RELEASE_COMMIT: ${{ inputs.release_commit }}
    defaults:
      run:
        working-directory: ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ASIE_RELEASE_COMMIT }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q backend
      - run: pytest -q

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      ASIE_RELEASE_COMMIT: ${{ inputs.release_commit }}
      ASIE_DOMAIN: ${{ secrets.ASIE_DOMAIN }}
      HOSTINGER_VPS_HOST: ${{ secrets.HOSTINGER_VPS_HOST }}
      HOSTINGER_VPS_USER: ${{ secrets.HOSTINGER_VPS_USER }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TAVILY_PROJECT: ${{ secrets.TAVILY_PROJECT }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY }}
      GOOGLE_MAP_ID: ${{ secrets.GOOGLE_MAP_ID }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      ASIE_TLS_EMAIL: ${{ secrets.ASIE_TLS_EMAIL }}
      ENABLE_EXTERNAL_FETCH: ${{ inputs.enable_external_fetch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ASIE_RELEASE_COMMIT }}

      - name: Validate deployment secrets
        run: |
          set -eu
          for name in ASIE_DOMAIN HOSTINGER_VPS_HOST HOSTINGER_VPS_USER; do
            value=$(printenv "$name" || true)
            if [ -z "$value" ]; then
              echo "Missing required GitHub production secret: $name" >&2
              exit 1
            fi
          done
          if [ "$ENABLE_EXTERNAL_FETCH" = "true" ]; then
            for name in DEEPSEEK_API_KEY TAVILY_API_KEY GOOGLE_MAPS_API_KEY PINECONE_API_KEY; do
              value=$(printenv "$name" || true)
              if [ -z "$value" ]; then
                echo "External fetch requested but provider secret is missing: $name" >&2
                exit 1
              fi
            done
          fi

      - name: Create protected production environment file
        run: |
          umask 077
          python - <<'PY'
          from pathlib import Path
          import os

          domain = os.environ["ASIE_DOMAIN"].strip()
          values = {
              "ASIE_ENV": "production",
              "ASIE_DOMAIN": domain,
              "ASIE_ALLOWED_ORIGINS": f"https://{domain}",
              "ASIE_API_PORT": "8794",
              "ASIE_DB_PATH": "/var/lib/asie/asie_local.sqlite3",
              "ASIE_DIB_DB_PATH": "/var/lib/asie/dib_local.sqlite3",
              "ASIE_PDF_RENDERER": "/usr/bin/chromium",
              "ASIE_STRICT_OPEN_DATA_PROFILE": "strict_open_data_only_v1",
              "ASIE_ALLOW_EXTERNAL_FETCH": os.environ["ENABLE_EXTERNAL_FETCH"],
              "ASIE_EXTERNAL_ALLOWED_HOSTS": "api.deepseek.com,api.tavily.com,geocode.googleapis.com,places.googleapis.com,maps.googleapis.com,api.pinecone.io,*.pinecone.io",
              "ASIE_EXTERNAL_TIMEOUT_SECONDS": "15",
              "ASIE_EXTERNAL_MAX_RESPONSE_BYTES": "4194304",
              "ASIE_EXTERNAL_MIN_INTERVAL_SECONDS": "1",
              "ASIE_EXTERNAL_USER_AGENT": "ASIE-Governed-Acquisition/1.0",
              "ASIE_EXTERNAL_ROBOTS_FAILURE_MODE": "deny",
              "DEEPSEEK_API_KEY": os.environ.get("DEEPSEEK_API_KEY", ""),
              "DEEPSEEK_MODEL": "deepseek-v4-flash",
              "TAVILY_API_KEY": os.environ.get("TAVILY_API_KEY", ""),
              "TAVILY_PROJECT": os.environ.get("TAVILY_PROJECT", ""),
              "TAVILY_SEARCH_DEPTH": "basic",
              "GOOGLE_MAPS_API_KEY": os.environ.get("GOOGLE_MAPS_API_KEY", ""),
              "VITE_GOOGLE_MAPS_BROWSER_KEY": os.environ.get("VITE_GOOGLE_MAPS_BROWSER_KEY", ""),
              "GOOGLE_MAP_ID": os.environ.get("GOOGLE_MAP_ID", ""),
              "GOOGLE_MAPS_REGION": "SA",
              "GOOGLE_MAPS_LANGUAGE": "ar",
              "PINECONE_API_KEY": os.environ.get("PINECONE_API_KEY", ""),
              "PINECONE_INDEX": "vision2030-kb",
              "PINECONE_API_VERSION": "2026-04",
              "PINECONE_EMBED_MODEL": "multilingual-e5-large",
              "PINECONE_NAMESPACE_PREFIX": "asie",
              "ASIE_TLS_EMAIL": os.environ.get("ASIE_TLS_EMAIL", ""),
              "ASIE_BACKUP_RETENTION_DAYS": "14",
          }
          content = "".join(f"{key}={value}\n" for key, value in values.items())
          Path("/tmp/asie.env.production").write_text(content, encoding="utf-8")
          PY
          chmod 600 /tmp/asie.env.production

      - name: Configure SSH
        env:
          HOSTINGER_VPS_SSH_KEY: ${{ secrets.HOSTINGER_VPS_SSH_KEY }}
        run: |
          set -eu
          if [ -z "$HOSTINGER_VPS_SSH_KEY" ]; then
            echo "Missing required GitHub production secret: HOSTINGER_VPS_SSH_KEY" >&2
            exit 1
          fi
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$HOSTINGER_VPS_SSH_KEY" > ~/.ssh/asie_deploy_key
          ssh-keyscan -H "$HOSTINGER_VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload protected environment
        run: |
          scp -i ~/.ssh/asie_deploy_key /tmp/asie.env.production \
            "$HOSTINGER_VPS_USER@$HOSTINGER_VPS_HOST:/tmp/asie.env.production"

      - name: Deploy main to Hostinger VPS
        run: |
          ssh -i ~/.ssh/asie_deploy_key "$HOSTINGER_VPS_USER@$HOSTINGER_VPS_HOST" "ASIE_RELEASE_COMMIT='$ASIE_RELEASE_COMMIT' bash -se" <<'REMOTE'
          set -euo pipefail
          command -v git >/dev/null
          command -v docker >/dev/null
          docker compose version >/dev/null

          DEPLOY_PATH="$HOME/asie"
          REPOSITORY_URL="https://github.com/alphasigma13579-lang/ASIE.git"
          PACKAGE_PATH="$DEPLOY_PATH/ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer"

          if [ ! -d "$DEPLOY_PATH/.git" ]; then
            git clone "$REPOSITORY_URL" "$DEPLOY_PATH"
          fi
          cd "$DEPLOY_PATH"
          git fetch --prune origin main
          current_main="$(git rev-parse origin/main)"
          test "$current_main" = "$ASIE_RELEASE_COMMIT"
          git checkout --detach "$ASIE_RELEASE_COMMIT"

          mv /tmp/asie.env.production "$PACKAGE_PATH/.env.production"
          chmod 600 "$PACKAGE_PATH/.env.production"
          cd "$PACKAGE_PATH"
          sh deploy/hostinger-vps-deploy.sh
          REMOTE

      - name: Remove local temporary secrets
        if: always()
        run: |
          rm -f /tmp/asie.env.production ~/.ssh/asie_deploy_key
