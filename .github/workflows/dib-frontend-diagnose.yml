name: DIB Frontend Diagnose

on:
  pull_request:
    paths:
      - .github/workflows/dib-frontend-diagnose.yml
      - ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer/src/**

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ASIE-Master-Build-Package-v1.0.0-r11-Agent-Engineer/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Capture TypeScript diagnostic
        id: typescript
        continue-on-error: true
        shell: bash
        run: |
          pnpm exec tsc -b --pretty false > /tmp/dib-ts-full.log 2>&1
          code=$?
          grep -E 'error TS|src/(DIBWorkspace|dibApi|dibRegistry|main)|contracts\.dib' /tmp/dib-ts-full.log | head -120 > /tmp/dib-ts-errors.txt || true
          test -s /tmp/dib-ts-errors.txt || cp /tmp/dib-ts-full.log /tmp/dib-ts-errors.txt
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: dib-typescript-errors
          path: /tmp/dib-ts-errors.txt
          if-no-files-found: error
      - name: Fail when TypeScript failed
        if: steps.typescript.outcome == 'failure'
        run: exit 1
